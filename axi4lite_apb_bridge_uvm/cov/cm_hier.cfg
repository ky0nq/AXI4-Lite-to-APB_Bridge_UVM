// ------------------------------------------------------------
// VCS -cm_hier scope for the AXI4-Lite -> APB bridge
//
// Only the DUT subtree is instrumented for code coverage
// (line / cond / fsm / branch / toggle). tb_top's own signals, the
// axi_lite_if / apb_if / bridge_reset_if instances, the procedural
// bridge_protocol_checker and all UVM classes are left out, so the
// toggle percentage describes RTL bits only.
//
// Functional coverage (covergroup transfer_cg in apb_coverage) is
// testbench coverage and is not affected by this file.
//
// Hierarchy covered:
//   tb_top.dut                          APB_v1_0          (wrapper, response mux)
//   tb_top.dut.APB_v1_0_S00_AXI_inst    APB_v1_0_S00_AXI  (bridge core, APB FSM)
// ------------------------------------------------------------
+tree tb_top.dut
